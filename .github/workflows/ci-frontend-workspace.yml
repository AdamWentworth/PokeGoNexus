name: ci-frontend-workspace

on:
  pull_request:
    paths:
      - "frontend/packages/app-core/**"
      - "frontend/packages/shared-contracts/**"
      - "frontend/packages/shared-domain/**"
      - "frontend/packages/shared-api-client/**"
      - "frontend/packages/shared-ui-tokens/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/ci-frontend-workspace.yml"
  push:
    branches: ["main", "master"]
    paths:
      - "frontend/packages/app-core/**"
      - "frontend/packages/shared-contracts/**"
      - "frontend/packages/shared-domain/**"
      - "frontend/packages/shared-api-client/**"
      - "frontend/packages/shared-ui-tokens/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/ci-frontend-workspace.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    env:
      VITE_POKEMON_API_URL: ${{ vars.VITE_POKEMON_API_URL || 'https://pokegonexus.com/api/pokemon' }}
      VITE_AUTH_API_URL: ${{ vars.VITE_AUTH_API_URL || 'https://pokegonexus.com/api/auth' }}
      VITE_RECEIVER_API_URL: ${{ vars.VITE_RECEIVER_API_URL || 'https://pokegonexus.com/api/receiver' }}
      VITE_USERS_API_URL: ${{ vars.VITE_USERS_API_URL || 'https://pokegonexus.com/api/users' }}
      VITE_SEARCH_API_URL: ${{ vars.VITE_SEARCH_API_URL || 'https://pokegonexus.com/api/search' }}
      VITE_LOCATION_SERVICE_URL: ${{ vars.VITE_LOCATION_SERVICE_URL || 'https://pokegonexus.com/api/location' }}
      VITE_EVENTS_API_URL: ${{ vars.VITE_EVENTS_API_URL || 'https://pokegonexus.com/api/events' }}
      VITE_ASSET_ORIGIN: ${{ vars.VITE_ASSET_ORIGIN || 'https://pokegonexus.com' }}
      VITE_FORCED_REFRESH_TIMESTAMP: ${{ vars.VITE_FORCED_REFRESH_TIMESTAMP || '1770678424675' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Workspace Dependencies
        run: npm ci
        working-directory: frontend

      # ci-frontend already runs the complete web lint/typecheck/test suite.
      # This workflow protects the mobile consumer of shared packages without
      # repeating the 1,400+ web tests.
      - name: Shared Code Mobile Lint
        run: npm run lint:mobile
        working-directory: frontend

      - name: Shared Code Mobile Typecheck
        run: npm run typecheck:mobile
        working-directory: frontend

      - name: Shared Code Mobile Test
        run: npm run test:mobile
        working-directory: frontend
