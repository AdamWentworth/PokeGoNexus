name: ci-frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "assets/**"
      - "nginx/**"
      - ".github/workflows/ci-frontend.yml"
      - ".github/workflows/smoke-frontend-prod.yml"
  push:
    branches: ["main", "master"]
    paths:
      - "frontend/**"
      - "assets/**"
      - "nginx/**"
      - ".github/workflows/ci-frontend.yml"
      - ".github/workflows/smoke-frontend-prod.yml"
  schedule:
    # Full Firefox/WebKit/Safari proofing runs nightly; pushes keep the two
    # Chromium viewports that catch application and responsive regressions.
    - cron: "27 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/apps/web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Shared Contracts Package Wiring
        run: npm run check:shared-contracts

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint Styles
        run: npm run lint:styles

      - name: Detect Unreferenced Files
        working-directory: frontend
        run: npm run lint:dead-code

      - name: Typecheck
        run: npm run typecheck

  unit-coverage:
    runs-on: ubuntu-latest
    env:
      VITE_POKEMON_API_URL: ${{ vars.VITE_POKEMON_API_URL || 'https://pokegonexus.com/api/pokemon' }}
      VITE_AUTH_API_URL: ${{ vars.VITE_AUTH_API_URL || 'https://pokegonexus.com/api/auth' }}
      VITE_RECEIVER_API_URL: ${{ vars.VITE_RECEIVER_API_URL || 'https://pokegonexus.com/api/receiver' }}
      VITE_USERS_API_URL: ${{ vars.VITE_USERS_API_URL || 'https://pokegonexus.com/api/users' }}
      VITE_SEARCH_API_URL: ${{ vars.VITE_SEARCH_API_URL || 'https://pokegonexus.com/api/search' }}
      VITE_LOCATION_SERVICE_URL: ${{ vars.VITE_LOCATION_SERVICE_URL || 'https://pokegonexus.com/api/location' }}
      VITE_EVENTS_API_URL: ${{ vars.VITE_EVENTS_API_URL || 'https://pokegonexus.com/api/events' }}
      VITE_ASSET_ORIGIN: ${{ vars.VITE_ASSET_ORIGIN || 'https://pokegonexus.com' }}
      VITE_FORCED_REFRESH_TIMESTAMP: ${{ vars.VITE_FORCED_REFRESH_TIMESTAMP || '1770678424675' }}
    defaults:
      run:
        working-directory: frontend/apps/web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Test + Coverage Gate
        run: npm run test:coverage

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-unit-coverage
          path: frontend/apps/web/.artifacts/tests/coverage/**
          if-no-files-found: ignore

  browser-quality:
    runs-on: ubuntu-latest
    env:
      VITE_POKEMON_API_URL: ${{ vars.VITE_POKEMON_API_URL || 'https://pokegonexus.com/api/pokemon' }}
      VITE_AUTH_API_URL: ${{ vars.VITE_AUTH_API_URL || 'https://pokegonexus.com/api/auth' }}
      VITE_RECEIVER_API_URL: ${{ vars.VITE_RECEIVER_API_URL || 'https://pokegonexus.com/api/receiver' }}
      VITE_USERS_API_URL: ${{ vars.VITE_USERS_API_URL || 'https://pokegonexus.com/api/users' }}
      VITE_SEARCH_API_URL: ${{ vars.VITE_SEARCH_API_URL || 'https://pokegonexus.com/api/search' }}
      VITE_LOCATION_SERVICE_URL: ${{ vars.VITE_LOCATION_SERVICE_URL || 'https://pokegonexus.com/api/location' }}
      VITE_EVENTS_API_URL: ${{ vars.VITE_EVENTS_API_URL || 'https://pokegonexus.com/api/events' }}
      VITE_ASSET_ORIGIN: ${{ vars.VITE_ASSET_ORIGIN || 'https://pokegonexus.com' }}
      VITE_FORCED_REFRESH_TIMESTAMP: ${{ vars.VITE_FORCED_REFRESH_TIMESTAMP || '1770678424675' }}
    defaults:
      run:
        working-directory: frontend/apps/web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Browser Runtimes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install --with-deps chromium
          fi

      - name: Validate Raid Route Performance Budgets
        run: >-
          npm run test:browsers:ci --
          --grep '@performance'
          --project chromium-desktop
          --workers 1

      - name: Cross-Browser Smoke
        env:
          # Cover each parity route and interaction once in smoke CI. Dedicated
          # performance comparisons retain their repeated-sample defaults.
          POKEGONEXUS_PERFORMANCE_SAMPLES: "1"
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            npm run test:browsers:ci -- --grep-invert '@performance'
          else
            npm run test:browsers:ci -- \
              --grep-invert '@performance' \
              --project chromium-desktop \
              --project mobile-chrome
          fi

      - name: Upload Performance Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-browser-performance
          path: frontend/apps/web/.artifacts/tests/reports/perf/**/*.json
          if-no-files-found: ignore

      - name: Upload Browser Proofing Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-browser-proofing
          path: frontend/apps/web/.artifacts/browser/**
          if-no-files-found: ignore

  build-audit:
    runs-on: ubuntu-latest
    env:
      VITE_POKEMON_API_URL: ${{ vars.VITE_POKEMON_API_URL || 'https://pokegonexus.com/api/pokemon' }}
      VITE_AUTH_API_URL: ${{ vars.VITE_AUTH_API_URL || 'https://pokegonexus.com/api/auth' }}
      VITE_RECEIVER_API_URL: ${{ vars.VITE_RECEIVER_API_URL || 'https://pokegonexus.com/api/receiver' }}
      VITE_USERS_API_URL: ${{ vars.VITE_USERS_API_URL || 'https://pokegonexus.com/api/users' }}
      VITE_SEARCH_API_URL: ${{ vars.VITE_SEARCH_API_URL || 'https://pokegonexus.com/api/search' }}
      VITE_LOCATION_SERVICE_URL: ${{ vars.VITE_LOCATION_SERVICE_URL || 'https://pokegonexus.com/api/location' }}
      VITE_EVENTS_API_URL: ${{ vars.VITE_EVENTS_API_URL || 'https://pokegonexus.com/api/events' }}
      VITE_ASSET_ORIGIN: ${{ vars.VITE_ASSET_ORIGIN || 'https://pokegonexus.com' }}
      VITE_FORCED_REFRESH_TIMESTAMP: ${{ vars.VITE_FORCED_REFRESH_TIMESTAMP || '1770678424675' }}
      VITE_SERVICE_WORKER_VERSION: ${{ github.sha }}
      FRONTEND_INITIAL_JS_GZIP_BUDGET_KB: ${{ vars.FRONTEND_INITIAL_JS_GZIP_BUDGET_KB || '180' }}
      FRONTEND_MAX_JS_CHUNK_GZIP_KB: ${{ vars.FRONTEND_MAX_JS_CHUNK_GZIP_KB || '130' }}
      FRONTEND_BUNDLE_BUDGET_REPORT_PATH: .artifacts/tests/reports/perf/bundle-budget.json
    defaults:
      run:
        working-directory: frontend/apps/web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        run: npm run build

      - name: Enforce Frontend Bundle Budgets
        run: node scripts/check-bundle-budget.mjs

      - name: Validate Build Environment Inputs
        shell: bash
        run: |
          set -euo pipefail
          for key in \
            VITE_POKEMON_API_URL \
            VITE_AUTH_API_URL \
            VITE_RECEIVER_API_URL \
            VITE_USERS_API_URL \
            VITE_SEARCH_API_URL \
            VITE_LOCATION_SERVICE_URL \
            VITE_EVENTS_API_URL \
            VITE_ASSET_ORIGIN; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required CI env: ${key}" >&2
              exit 1
            fi
          done

      - name: Validate Built API Base URLs
        shell: bash
        run: |
          set -euo pipefail
          if ! find dist/assets -maxdepth 1 -type f -name '*.js' | grep -q .; then
            echo "No JS bundles found in dist/assets" >&2
            exit 1
          fi

          for expected in \
            "${VITE_AUTH_API_URL}" \
            "${VITE_USERS_API_URL}" \
            "${VITE_SEARCH_API_URL}" \
            "${VITE_POKEMON_API_URL}"; do
            # Frontend is code-split; env-backed URLs may live in lazy chunks (e.g. Search-*.js),
            # not only in index-*.js.
            if ! grep -R -q --include='*.js' "${expected}" dist/assets; then
              echo "Expected API base URL not found in bundle: ${expected}" >&2
              exit 1
            fi
          done

      - name: Audit (Production dependencies, blocking)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit (Dev dependencies, informational)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/tests/reports
          npm audit --audit-level=moderate --json > .artifacts/tests/reports/npm-audit-dev.json

      - name: Upload Dev Audit Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dev-audit-report
          path: frontend/apps/web/.artifacts/tests/reports/npm-audit-dev.json
          if-no-files-found: ignore

      - name: Upload Build Budget Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build-budget
          path: frontend/apps/web/.artifacts/tests/reports/perf/**/*.json
          if-no-files-found: ignore

  container-security-build:
    runs-on: ubuntu-latest
    needs: [static-quality, unit-coverage, browser-quality, build-audit]
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      IMAGE_REPO: adamwentworth/frontend-nginx
      VITE_POKEMON_API_URL: ${{ vars.VITE_POKEMON_API_URL || 'https://pokegonexus.com/api/pokemon' }}
      VITE_AUTH_API_URL: ${{ vars.VITE_AUTH_API_URL || 'https://pokegonexus.com/api/auth' }}
      VITE_RECEIVER_API_URL: ${{ vars.VITE_RECEIVER_API_URL || 'https://pokegonexus.com/api/receiver' }}
      VITE_USERS_API_URL: ${{ vars.VITE_USERS_API_URL || 'https://pokegonexus.com/api/users' }}
      VITE_SEARCH_API_URL: ${{ vars.VITE_SEARCH_API_URL || 'https://pokegonexus.com/api/search' }}
      VITE_LOCATION_SERVICE_URL: ${{ vars.VITE_LOCATION_SERVICE_URL || 'https://pokegonexus.com/api/location' }}
      VITE_EVENTS_API_URL: ${{ vars.VITE_EVENTS_API_URL || 'https://pokegonexus.com/api/events' }}
      VITE_ASSET_ORIGIN: ${{ vars.VITE_ASSET_ORIGIN || 'https://pokegonexus.com' }}
      VITE_FORCED_REFRESH_TIMESTAMP: ${{ vars.VITE_FORCED_REFRESH_TIMESTAMP || '1770678424675' }}
      VITE_SERVICE_WORKER_VERSION: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Shared Contracts Package Wiring
        working-directory: frontend/apps/web
        run: npm run check:shared-contracts

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend/apps/web
        run: npm run build

      - name: Stage Frontend Build For Nginx Image
        shell: bash
        run: |
          set -euo pipefail
          rm -rf nginx/build
          rm -rf nginx/canonical-assets
          mkdir -p nginx/build
          mkdir -p nginx/canonical-assets
          cp -R frontend/apps/web/dist/. nginx/build/
          cp -R assets/. nginx/canonical-assets/

      - name: Build Container Image
        run: |
          docker build --pull \
            --build-arg "POKEGONEXUS_BUILD_SHA=${GITHUB_SHA}" \
            -t frontend_nginx:ci-${GITHUB_SHA} \
            ./nginx

      - name: Stage Web Runtime Dependency Manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .artifacts/frontend-runtime-audit
          node frontend/apps/web/scripts/generate-runtime-audit-manifest.mjs \
            .artifacts/frontend-runtime-audit/package.json
          npm install \
            --package-lock-only \
            --ignore-scripts \
            --prefix .artifacts/frontend-runtime-audit

      - name: Trivy Filesystem Scan (Frontend)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            ghcr.io/aquasecurity/trivy:0.65.0 \
            fs \
            --scanners vuln \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            /workspace/.artifacts/frontend-runtime-audit

      - name: Trivy Image Scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            ghcr.io/aquasecurity/trivy:0.65.0 \
            image \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            frontend_nginx:ci-${{ github.sha }}

      - name: Generate SBOM (CycloneDX)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/workspace" \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            ghcr.io/aquasecurity/trivy:0.65.0 \
            image \
            --format cyclonedx \
            --output /workspace/frontend_nginx_image_sbom.cdx.json \
            frontend_nginx:ci-${{ github.sha }}

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-nginx-image-sbom
          path: frontend_nginx_image_sbom.cdx.json
          if-no-files-found: error

      - name: DockerHub Login
        if: ${{ github.event_name != 'pull_request' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          echo "${DOCKERHUB_TOKEN}" | docker login -u "adamwentworth" --password-stdin

      - name: Push Image To DockerHub
        if: ${{ github.event_name != 'pull_request' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          docker tag frontend_nginx:ci-${{ github.sha }} ${IMAGE_REPO}:sha-${{ github.sha }}
          docker tag frontend_nginx:ci-${{ github.sha }} ${IMAGE_REPO}:latest
          docker push ${IMAGE_REPO}:sha-${{ github.sha }}
          docker push ${IMAGE_REPO}:latest

      - name: DockerHub Push Skipped
        if: ${{ github.event_name != 'pull_request' && env.DOCKERHUB_TOKEN == '' }}
        run: |
          echo "DockerHub push skipped. Set DOCKERHUB_TOKEN repository secret."
