name: ci-mobile

on:
  pull_request:
    paths:
      - "frontend/apps/mobile/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/patches/**"
      - "frontend/packages/shared-api-client/**"
      - "frontend/packages/shared-contracts/**"
      - "frontend/packages/shared-domain/**"
      - "frontend/packages/shared-ui-tokens/**"
      - ".github/workflows/ci-mobile.yml"
  push:
    branches: ["main", "master"]
    paths:
      - "frontend/apps/mobile/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/patches/**"
      - "frontend/packages/shared-api-client/**"
      - "frontend/packages/shared-contracts/**"
      - "frontend/packages/shared-domain/**"
      - "frontend/packages/shared-ui-tokens/**"
      - ".github/workflows/ci-mobile.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/apps/mobile

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Verify Android Beta Release Gates
        run: node --test scripts/android-beta/release.test.mjs

      - name: Verify Native URL Decoder Compatibility
        run: node --test scripts/query-string-security.test.cjs

      - name: Verify Expo Dependency Health
        run: npx expo-doctor

      - name: Export Native Preview Android Bundle
        env:
          EXPO_PUBLIC_MOBILE_EXPERIENCE: native-preview
        run: npx expo export --platform android --output-dir dist-ci-android

      - name: Export Native Preview iOS Bundle
        env:
          EXPO_PUBLIC_MOBILE_EXPERIENCE: native-preview
        run: npx expo export --platform ios --output-dir dist-ci-ios
