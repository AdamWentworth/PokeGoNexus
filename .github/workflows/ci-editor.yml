name: ci-editor

on:
  pull_request:
    paths:
      - "editor/**"
      - "pokemon/migrations/**"
      - "pokemon/go.mod"
      - "pokemon/go.sum"
      - ".github/workflows/ci-editor.yml"
  push:
    branches: ["main", "master"]
    paths:
      - "editor/**"
      - "pokemon/migrations/**"
      - "pokemon/go.mod"
      - "pokemon/go.sum"
      - ".github/workflows/ci-editor.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: pokemon/go.sum

      - name: Install Editor Test Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r editor/requirements.txt

      - name: Validate Editor Python Syntax
        run: python -m compileall editor

      - name: Run PostgreSQL-only Editor Test Suite
        run: bash editor/tests/test-postgres-database-manager.sh
