name: ci-authentication

on:
  pull_request:
    paths:
      - "authentication/**"
      - ".github/workflows/ci-authentication.yml"
  push:
    branches: ["main", "master"]
    paths:
      - "authentication/**"
      - ".github/workflows/ci-authentication.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: authentication

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: authentication/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: JavaScript Syntax Check
        shell: bash
        run: |
          set -euo pipefail
          find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Integration Tests
        run: npm test

      - name: Audit Gate (High+)
        run: npm audit --omit=dev --audit-level=high

  container-security-build:
    runs-on: ubuntu-latest
    needs: quality-gates
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      IMAGE_REPO: adamwentworth/authentication

    steps:
      - uses: actions/checkout@v5

      - name: Build Container Image
        run: >-
          docker build
          --build-arg POKEGONEXUS_BUILD_SHA=${{ github.sha }}
          -t authentication:ci-${{ github.sha }}
          ./authentication

      - name: Trivy Filesystem Scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            ghcr.io/aquasecurity/trivy:0.65.0 \
            fs \
            --scanners vuln \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            /workspace/authentication

      - name: Trivy Image Scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            ghcr.io/aquasecurity/trivy:0.65.0 \
            image \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            authentication:ci-${{ github.sha }}

      - name: Generate SBOM (CycloneDX)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/workspace" \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            ghcr.io/aquasecurity/trivy:0.65.0 \
            image \
            --format cyclonedx \
            --output /workspace/authentication_image_sbom.cdx.json \
            authentication:ci-${{ github.sha }}

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: authentication-image-sbom
          path: authentication_image_sbom.cdx.json
          if-no-files-found: error

      - name: DockerHub Login
        if: ${{ github.event_name != 'pull_request' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          echo "${DOCKERHUB_TOKEN}" | docker login -u "adamwentworth" --password-stdin

      - name: Push Image To DockerHub
        if: ${{ github.event_name != 'pull_request' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          docker tag authentication:ci-${{ github.sha }} ${IMAGE_REPO}:sha-${{ github.sha }}
          docker tag authentication:ci-${{ github.sha }} ${IMAGE_REPO}:latest
          docker push ${IMAGE_REPO}:sha-${{ github.sha }}
          docker push ${IMAGE_REPO}:latest

      - name: DockerHub Push Skipped
        if: ${{ github.event_name != 'pull_request' && env.DOCKERHUB_TOKEN == '' }}
        run: |
          echo "DockerHub push skipped. Set DOCKERHUB_TOKEN repository secret."
