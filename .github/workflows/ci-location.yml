name: ci-location

on:
  pull_request:
    paths:
      - "location/**"
      - ".github/workflows/ci-location.yml"
  push:
    branches: ["main", "master"]
    paths:
      - "location/**"
      - ".github/workflows/ci-location.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: location
    env:
      LOCATION_COVERAGE_MIN: "30.0"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: location/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Test
        run: go test ./...

      - name: Coverage Gate
        shell: bash
        run: |
          set -euo pipefail
          go test -coverprofile=coverage.out ./...
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "location coverage: ${coverage}% (min ${LOCATION_COVERAGE_MIN}%)"
          awk -v cov="${coverage}" -v min="${LOCATION_COVERAGE_MIN}" 'BEGIN { exit (cov+0 >= min+0) ? 0 : 1 }'
          rm -f coverage.out

      - name: Test Race
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Govulncheck
        run: govulncheck ./...

  container-security-build:
    runs-on: ubuntu-latest
    needs: quality-gates
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      IMAGE_REPO: adamwentworth/location_service

    steps:
      - uses: actions/checkout@v5

      - name: Build Container Image
        run: >-
          docker build --pull
          --build-arg POKEGONEXUS_BUILD_SHA=${{ github.sha }}
          -t location_service:ci-${{ github.sha }}
          ./location

      - name: Trivy Filesystem Scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            ghcr.io/aquasecurity/trivy:0.65.0 \
            fs \
            --scanners vuln \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            /workspace/location

      - name: Trivy Image Scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            ghcr.io/aquasecurity/trivy:0.65.0 \
            image \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            location_service:ci-${{ github.sha }}

      - name: Generate SBOM (CycloneDX)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/workspace" \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            ghcr.io/aquasecurity/trivy:0.65.0 \
            image \
            --format cyclonedx \
            --output /workspace/location_image_sbom.cdx.json \
            location_service:ci-${{ github.sha }}

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: location-image-sbom
          path: location_image_sbom.cdx.json
          if-no-files-found: error

      - name: DockerHub Login
        if: ${{ github.event_name != 'pull_request' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          echo "${DOCKERHUB_TOKEN}" | docker login -u "adamwentworth" --password-stdin

      - name: Push Image To DockerHub
        if: ${{ github.event_name != 'pull_request' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          docker tag location_service:ci-${{ github.sha }} ${IMAGE_REPO}:sha-${{ github.sha }}
          docker tag location_service:ci-${{ github.sha }} ${IMAGE_REPO}:latest
          docker push ${IMAGE_REPO}:sha-${{ github.sha }}
          docker push ${IMAGE_REPO}:latest

      - name: DockerHub Push Skipped
        if: ${{ github.event_name != 'pull_request' && env.DOCKERHUB_TOKEN == '' }}
        run: |
          echo "DockerHub push skipped. Set DOCKERHUB_TOKEN repository secret."
