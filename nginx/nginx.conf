worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    log_format proxy_debug '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      '"$upstream_addr" "$upstream_response_time"';

    access_log /var/log/nginx/proxy_access.log proxy_debug;
    error_log /var/log/nginx/error.log debug;

    keepalive_timeout 3600s;
    send_timeout 3600s;

    # Redirect HTTP requests from www to non-www
    server {
        listen 80;
        server_name www.pokegonexus.com;
        return 301 https://pokegonexus.com$request_uri;
    }

    # Redirect HTTP requests for non-www to HTTPS
    server {
        listen 80;
        server_name pokegonexus.com;
        return 301 https://pokegonexus.com$request_uri;
    }

    # Main HTTPS server for non-www
    server {
        listen 443 ssl;
        server_name pokegonexus.com;

        ssl_certificate     /etc/letsencrypt/live/pokegonexus.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pokegonexus.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location /assets/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location /images/ {
            root /usr/share/nginx/html/media;
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # Shared static assets for web/mobile from repo-root assets/
        location /media/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Serve the checksum-verified release file directly, including byte-range
        # requests for interrupted mobile downloads. Never fall back to the SPA.
        location ~ "^/downloads/android/(?<apk_filename>PokeGoNexus-Android-[0-9]+\.apk)$" {
            root /usr/share/nginx/html;
            try_files $uri =404;
            types { }
            default_type application/vnd.android.package-archive;
            gzip off;
            max_ranges 1;
            add_header Content-Disposition 'attachment; filename="$apk_filename"';
            add_header X-Content-Type-Options nosniff;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /downloads/ {
            return 404;
        }

        # Service workers control application updates and must never be held by
        # browser or edge caches after a new frontend deployment.
        location = /sw.js {
            root /usr/share/nginx/html;
            try_files $uri =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Service-Worker-Allowed "/" always;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/pokemon/ {
            set $pokemon_upstream http://pokemon_data_container:3001;
            rewrite ^/api/pokemon/(.*)$ /pokemon/$1 break;
            proxy_pass $pokemon_upstream;
            include /etc/nginx/proxy_params;
        }

        location /api/auth/ {
            set $auth_upstream http://authentication_container:3002;
            rewrite ^/api/auth/(.*)$ /auth/$1 break;
            proxy_pass $auth_upstream;
            include /etc/nginx/proxy_params;
        }

        location /api/receiver/ {
            set $receiver_upstream http://receiver_service:3003;
            rewrite ^/api/receiver/(.*)$ /api/$1 break;
            proxy_pass $receiver_upstream;
            include /etc/nginx/proxy_params;
        }

        location /api/users/ {
            set $users_upstream http://users_service:3005;
            rewrite ^/api/users/(.*)$ /api/$1 break;
            proxy_pass $users_upstream;
            include /etc/nginx/proxy_params;
        }

        location /api/search/ {
            set $search_upstream http://search_service:3006;
            rewrite ^/api/search/(.*)$ /api/$1 break;
            proxy_pass $search_upstream;
            include /etc/nginx/proxy_params;
        }

        location /api/location/ {
            set $location_upstream http://location_service:3007;
            rewrite ^/api/location/(.*)$ /$1 break;
            proxy_pass $location_upstream;
            include /etc/nginx/proxy_params;
        }

        location /api/events/ {
            set $events_upstream http://events_service:3008;
            rewrite ^/api/events/(.*)$ /api/$1 break;
            proxy_pass $events_upstream;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection 'keep-alive';
            proxy_read_timeout 3600s;
            proxy_connect_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding off;
            proxy_set_header X-Accel-Buffering no;

            include /etc/nginx/proxy_params;
        }
    }

    # Redirect HTTPS www to non-www
    server {
        listen 443 ssl;
        server_name www.pokegonexus.com;

        ssl_certificate     /etc/letsencrypt/live/pokegonexus.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pokegonexus.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        return 301 https://pokegonexus.com$request_uri;
    }

}
