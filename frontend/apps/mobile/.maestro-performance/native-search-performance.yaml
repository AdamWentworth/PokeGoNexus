appId: ${APP_ID}
name: Native Search performance contract
tags:
  - android
  - performance
---
- openLink:
    link: ${APP_LINK_BASE}/device-smoke/search
- runFlow:
    when:
      visible: "^Continue$"
    commands:
      - tapOn:
          text: "^Continue$"
          optional: true
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: Search
    timeout: 60000
- assertVisible: Shiny Pikachu

# Result display modes and a concrete map-marker selection.
- tapOn:
    id: native-search-map-view
- extendedWaitUntil:
    visible:
      id: native-search-maplibre
    timeout: 30000
- tapOn:
    id: native-search-map-performance-select-search-trade-pikachu-3
- assertVisible: "Selected map listing: KitsCollector, Pikachu"
- takeScreenshot: search-map-selection
- tapOn:
    id: native-search-list-view
- assertVisible: Shiny Pikachu

# Primary controls, searchable Pokémon picker, and listing ownership.
- tapOn: Modify search
- assertVisible: LOOKING FOR
- tapOn: Choose Pokémon
- extendedWaitUntil:
    visible: Choose a Pokémon
    timeout: 10000
- tapOn: Search Choose a Pokémon
- inputText: Char
- tapOn: Select Charizard
- assertVisible: Charizard
- tapOn: Caught
- tapOn: For Trade

# Filter surface, section changes, a visible filter result, and submitted results.
- tapOn: Filters
- extendedWaitUntil:
    visible: Refine your search
    timeout: 10000
- tapOn: Location
- assertVisible: Where should we look\?
- tapOn: Matching
- assertVisible: Mutual matches only
- tapOn: Mutual matches only
- tapOn: Apply & search.*
- extendedWaitUntil:
    visible: ".*SEARCH COMPLETE.*"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: Listing details
    direction: DOWN
    timeout: 30000
- tapOn: Listing details
- assertVisible: Caught in Coal Harbour
- takeScreenshot: search-results-details

# Coordinated category slide plus auto-search and clear trainer behavior.
- scrollUntilVisible:
    element:
      text: Trainer search
    direction: UP
    timeout: 30000
- tapOn: Trainer search
- extendedWaitUntil:
    visible: Find a trainer
    timeout: 15000
- tapOn: Username or Pokémon GO name
- inputText: Other
- hideKeyboard
- extendedWaitUntil:
    visible: Nexus · @OtherTrainer
    timeout: 15000
- tapOn: Clear trainer search
- assertVisible: Find people you know
- takeScreenshot: search-trainers-cleared
