appId: ${APP_ID}
name: Native collection performance contract
tags:
  - android
  - performance
---
- openLink:
    link: ${APP_LINK_BASE}/device-smoke/collection?performance=1
- runFlow:
    when:
      visible: "^Continue$"
    commands:
      - tapOn:
          text: "^Continue$"
          optional: true
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: POKÉMON
    timeout: 45000
- extendedWaitUntil:
    visible: Bulbasaur
    timeout: 45000

# Search overlay and staged filter result.
- tapOn: Search Pokémon
- extendedWaitUntil:
    visible: Variants
    timeout: 10000
- tapOn:
    id: native-collection-filter-shiny
- extendedWaitUntil:
    visible: Shiny Bulbasaur
    timeout: 10000
- tapOn: Close Pokémon search

# Typed query and evolutionary-line result.
- tapOn: Search Pokémon
- inputText: Ivysaur
- extendedWaitUntil:
    visible: Ivysaur
    timeout: 10000
- tapOn: SHOW EVOLUTIONARY LINE
- extendedWaitUntil:
    visible: Bulbasaur
    timeout: 10000
- tapOn: Close Pokémon search

# Sort presentation and committed result.
- tapOn: Sort by NUMBER ascending
- extendedWaitUntil:
    visible:
      id: native-collection-sort-menu
    timeout: 10000
- tapOn: NAME
- extendedWaitUntil:
    visible: Abomasnow
    timeout: 10000

# Tag-to-Pokémon slide and clear-tag confirmation.
- tapOn: TAGS
- extendedWaitUntil:
    visible: Inventory tags
    timeout: 10000
- tapOn:
    text: "Open All Caught, [0-9]+ Pokémon"
- extendedWaitUntil:
    visible: "(CAUGHT)"
    timeout: 10000
- extendedWaitUntil:
    visible: Bulbasaur
    timeout: 10000
- tapOn: Clear Caught tag filter
- extendedWaitUntil:
    visible:
      id: native-confirmation-dialog
    timeout: 10000
- tapOn: Cancel

# Selection and organizer presentation.
- longPressOn:
    id: parity-card-0001-default_ce5955cf-5f51-4eb7-a92d-258d71491497
- extendedWaitUntil:
    visible: "Organize (1)"
    timeout: 10000
- tapOn: "Organize (1)"
- extendedWaitUntil:
    visible: Organize Pokémon
    timeout: 10000
- tapOn: Close Pokémon organizer
- tapOn:
    id: parity-card-0001-default_ce5955cf-5f51-4eb7-a92d-258d71491497
- extendedWaitUntil:
    notVisible: "Organize (1)"
    timeout: 10000

# Adjacent-instance navigation in both directions.
- tapOn:
    id: parity-card-0001-default_ce5955cf-5f51-4eb7-a92d-258d71491497
- extendedWaitUntil:
    visible:
      id: native-instance-overlay
    timeout: 10000
- tapOn:
    id: native-instance-next
- extendedWaitUntil:
    visible: Butterfree
    timeout: 10000
- tapOn:
    id: native-instance-previous
- extendedWaitUntil:
    visible: Bulbasaur
    timeout: 10000
