appId: ${APP_ID}
name: Native community rankings tool smoke
---
- openLink: "${APP_LINK_BASE}/device-smoke/tools?tool=rankings"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "^Continue$"
    commands:
      - tapOn:
          text: "^Continue$"
          optional: true
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- assertVisible: "Community Rankings"
- assertVisible: "Shiny Bulbasaur"
- tapOn: "Rarest owned"
- assertVisible: "RAREST OWNED"
- tapOn: "Most wanted"
- assertVisible: "MOST WANTED"
- tapOn: "I want"
- assertVisible: ".*1 results.*"
- tapOn: "Search rankings"
- inputText: "bulba"
- hideKeyboard
- extendedWaitUntil:
    visible: "Shiny Bulbasaur"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "How these rankings work"
    direction: DOWN
- tapOn: "How these rankings work"
- assertVisible: ".*Duplicate wanted copies do not add votes.*"
- takeScreenshot: "native-tool-rankings"
