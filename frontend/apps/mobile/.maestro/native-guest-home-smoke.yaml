---
- openLink:
    link: ${APP_LINK_BASE}/device-smoke/home?guest=1
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "^Continue$"
    commands:
      - tapOn:
          text: "^Continue$"
          optional: true
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: THE ULTIMATE TRAINER HUB
    timeout: 45000
- assertVisible: Build your collection.
- assertVisible: Find the right trade.
- assertVisible: QUICK NAVIGATION
- assertVisible: Tap the Poké Ball below to explore the app.
