appId: ${APP_ID}
name: Native login parity smoke
tags:
  - android
  - native-login
---
- openLink:
    link: ${APP_LINK_BASE}/device-smoke/login
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "^Continue$"
    commands:
      - tapOn:
          text: "^Continue$"
          optional: true
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: Username or Email
    timeout: 45000
- assertVisible: Password
- assertVisible: Login
- assertVisible: Reset Password
- assertVisible: Login with Google
- assertVisible: Login with Discord
- assertVisible: Login with Facebook
- takeScreenshot: native-login-initial
- tapOn: Show password
- assertVisible: Hide password
- tapOn: Reset Password
- assertVisible: Reset your password
- tapOn: Recovery username or email
- inputText: visual@example.invalid
- hideKeyboard
- tapOn: Email reset link
- extendedWaitUntil:
    visible: If that account exists, reset instructions are on the way.
    timeout: 10000
- takeScreenshot: native-login-password-reset-feedback
